<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rekap Lolos Seleksi — Innovation Gateway XXIX 2026</title>
<style>
  :root {
    color-scheme: light;
    --page:      #F4F7F8;
    --surface:   #FFFFFF;
    --border:    #DCE5E9;
    --border-str:#C3D2D8;
    --ink:       #0F1A1E;
    --ink-2:     #4A5B62;
    --ink-muted: #7A8B92;
    --brand:     #008FA3;
    --brand-dark:#035B71;
    --warn:      #B45309;
    --warn-bg:   #FBEEDD;
    --shadow:    0 1px 2px rgba(15,26,30,.05), 0 18px 44px rgba(15,26,30,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:      #0A0E10;
      --surface:   #12181B;
      --border:    #263237;
      --border-str:#35454C;
      --ink:       #F2F6F7;
      --ink-2:     #B4C3C9;
      --ink-muted: #8798A0;
      --brand:     #159FB4;
      --brand-dark:#6FD3E4;
      --warn:      #E0A33A;
      --warn-bg:   #2C2416;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0A0E10;
    --surface:   #12181B;
    --border:    #263237;
    --border-str:#35454C;
    --ink:       #F2F6F7;
    --ink-2:     #B4C3C9;
    --ink-muted: #8798A0;
    --brand:     #159FB4;
    --brand-dark:#6FD3E4;
    --warn:      #E0A33A;
    --warn-bg:   #2C2416;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 24px;
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .gate {
    width: 100%; max-width: 430px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
  }
  .gate-top {
    background: linear-gradient(135deg, #035B71 0%, #007B93 55%, #00A2B9 100%);
    color: #fff; padding: 22px 26px 20px;
  }
  .eyebrow {
    margin: 0 0 6px; font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.82);
  }
  .gate-top h1 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -.015em; }
  .gate-body { padding: 24px 26px 22px; }
  .gate-body p.intro { margin: 0 0 18px; font-size: 14.5px; color: var(--ink-2); }
  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 7px; }
  .row { display: flex; gap: 8px; }
  input[type="password"], input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 15px; padding: 11px 13px;
    background: var(--page); color: var(--ink);
    border: 1px solid var(--border-str); border-radius: 10px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  button {
    font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer;
    padding: 11px 20px; border: none; border-radius: 10px;
    background: var(--brand); color: #fff; white-space: nowrap;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: progress; }
  .msg {
    margin-top: 14px; font-size: 13.5px; border-radius: 9px;
    padding: 10px 13px; display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: var(--warn-bg); color: var(--warn); border-left: 3px solid var(--warn); }
  .msg.info { background: var(--page); color: var(--ink-2); border-left: 3px solid var(--brand); }
  .foot { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-muted); }
  .foot p { margin: 0 0 5px; }
  @media (prefers-reduced-motion: no-preference) {
    .gate { animation: rise .32s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
  <main class="gate">
    <div class="gate-top">
      <p class="eyebrow">Innovation Gateway XXIX · 2026</p>
      <h1>Rekap Karya Lolos Seleksi Makalah &amp; Proposal</h1>
    </div>
    <div class="gate-body">
      <p class="intro">Dokumen ini dibatasi aksesnya. Masukkan kata sandi untuk membuka rekap.</p>
      <form id="f" autocomplete="off">
        <label for="pw">Kata sandi</label>
        <div class="row">
          <input id="pw" type="password" autocomplete="current-password" autofocus aria-describedby="msg">
          <button id="go" type="submit">Buka</button>
        </div>
      </form>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="foot">
        <p>Isi halaman tersimpan dalam bentuk terenkripsi dan hanya dapat dibuka dengan kata sandi yang benar.</p>
        <p>Voltaic Engine © 2026</p>
      </div>
    </div>
  </main>

    go.disabled = true; pw.disabled = true;
    say("Membuka dokumen…", "info");

    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
      })
      .then(function (buf) {
        var html = new TextDecoder().decode(buf);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        go.disabled = false; pw.disabled = false;
        pw.value = ""; pw.focus();
        say("Kata sandi salah. Silakan coba lagi.", "err");
      });
  });
})();
</script>
</body>
</html>
